function updateReviewSquare(container,file,rank,isLight){
  const el=document.createElement('div'); el.className='review-square '+(isLight?'light':'dark');
  el.style.left=(file*12.5)+'%'; el.style.top=((7-rank)*12.5)+'%'; return el;
}
function renderReview(){
  if(!state.review.open||!state.daily||!state.daily.complete) return;
  const overlay=document.getElementById('reviewOverlay'); overlay.classList.add('show'); overlay.setAttribute('aria-hidden','false');
  const tabs=document.getElementById('reviewTabs');
  tabs.innerHTML=state.daily.puzzleIds.map(function(id,i){
    const d=state.daily.slots[i], label=d.status==='solved'?'✓': '◐';
    return '<button class="review-tab '+(i===state.review.slot?'active':'')+'" data-slot="'+i+'">'+label+' '+(i+1)+'</button>';
  }).join('');
  tabs.querySelectorAll('.review-tab').forEach(function(btn){btn.addEventListener('click',function(){state.review.slot=Number(btn.dataset.slot);state.review.moveIndex=0;renderReview();});});
  const idx=state.daily.puzzleIds[state.review.slot], p=PUZZLES[idx];
  const chess=new Chess(p.fen);
  let fromSq=null,toSq=null;
  for(let i=0;i<state.review.moveIndex && i<p.moves.length;i++){
    const mv=chess.moveFromUCI(p.moves[i]); if(!mv) break;
    fromSq=algebraic(mv.from); toSq=algebraic(mv.to); chess.makeMove(mv);
  }
  const board=document.getElementById('reviewBoard'); board.innerHTML='';
  for(let rank=0;rank<8;rank++) for(let file=0;file<8;file++){
    const el=updateReviewSquare(board,file,rank,(file+rank)%2===1);
    const alg=FILES[file]+(rank+1); if(alg===fromSq) el.classList.add('move-from'); if(alg===toSq) el.classList.add('move-to'); board.appendChild(el);
  }
  for(let sqi=0;sqi<64;sqi++){
    const pc=chess.board[sqi]; if(!pc) continue;
    const file=fileOf(sqi), rank=rankOf(sqi), el=document.createElement('div'); el.className='review-piece'; el.style.left=(file*12.5)+'%'; el.style.top=((7-rank)*12.5)+'%'; el.innerHTML=pieceSVG(pc.toUpperCase(),pc===pc.toUpperCase()); board.appendChild(el);
  }
  const detail=state.daily.slots[state.review.slot];
  const resultLabel=detail.status==='solved'?'Solved cleanly':'Solution revealed';
  document.getElementById('reviewResult').textContent=resultLabel;
  const mistakeText=detail.mistakes?detail.mistakes+' mistake'+(detail.mistakes===1?'':'s'): 'No mistakes';
  const hintText=detail.hintUsed?' · Hint used':'';
  var firstTheme=(p.themes||[]).find(function(t){return THEME_LABELS[t];});
  document.getElementById('reviewMeta').textContent=mistakeText+hintText+' · '+DAILY_SLOT_SPECS[state.review.slot].label+(firstTheme?' · '+THEME_LABELS[firstTheme]:'');
  const nextBtn=document.getElementById('reviewNextMoveBtn');
  const max=p.moves.length; nextBtn.disabled=state.review.moveIndex>=max; nextBtn.textContent=state.review.moveIndex>=max?'Solution shown':'Next move →';
  document.getElementById('reviewPrevBtn').disabled=state.review.slot===0;
  document.getElementById('reviewNextBtn').disabled=state.review.slot===2;
  document.getElementById('reviewMoveNote').textContent='Move '+Math.min(state.review.moveIndex,max)+' of '+max;
}
function openReview(){
  if(!state.daily||!state.daily.complete) return;
  state.review.open=true; state.review.slot=0; state.review.moveIndex=0; renderReview();
}
function closeReview(){
  state.review.open=false; const el=document.getElementById('reviewOverlay'); el.classList.remove('show'); el.setAttribute('aria-hidden','true');
}
function changeReviewSlot(delta){
  const next=state.review.slot+delta; if(next<0||next>2) return; state.review.slot=next; state.review.moveIndex=0; renderReview();
}

function renderDailyProgress(){
  const steps=document.querySelectorAll('#dailyProgress .progress-step');
  steps.forEach(function(el,i){
    const status=todayPuzzleStatus(i); el.classList.toggle('done',status==='solved'||status==='revealed');
    el.classList.toggle('active',i===state.currentDailySlot && !state.daily.complete);
  });
}
function renderAll(){
  const ratingEl=document.getElementById('ratingValue'); if(ratingEl) ratingEl.textContent=Math.round(state.playerRating);
  const displayStreak=currentDayDisplayStreak();
  const streakEl=document.getElementById('streakValue'); if(streakEl) streakEl.textContent=displayStreak;
  const streakBadge=document.getElementById('headerStreak'), streakIcon=document.getElementById('streakIcon');
  if(streakBadge){ streakBadge.classList.toggle('zero',displayStreak===0); streakBadge.classList.toggle('has-streak',displayStreak>0); }
  if(streakIcon) streakIcon.innerHTML=displayStreak>0?ICONS.flame:ICONS.flameOff;
  const dateEl=document.getElementById('dailyDate'); if(dateEl){const d=new Date(); dateEl.textContent=d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}
  renderDailyProgress();
  const counter=document.getElementById('puzzleCounter'); if(counter) counter.textContent='Puzzle '+(state.daily?Math.min(state.currentDailySlot+1,3):1)+' / 3';
  if(!state.daily||state.currentPuzzleIndex==null||!state.chess){
    document.getElementById('statusLabel').textContent='Loading…'; return;
  }
  const p=PUZZLES[state.currentPuzzleIndex], spec=DAILY_SLOT_SPECS[state.currentDailySlot];
  document.getElementById('puzzleEyebrow').textContent=spec.label;
  document.getElementById('difficultyChip').textContent=spec.label;
  document.getElementById('turnDot').className='turn-dot '+state.chess.turn;
  const solver=state.playerColor==='w'?'White':'Black';
  let label=''; let title='Find the best move';
  if(state.status==='player-turn'){
    if(state.feedback) label=state.feedback;
    else if(state.selectedSquare) label='Choose a square';
    else label='Your move';
    title='Find the best move';
  }
  else if(state.status==='opponent-move'){label='Opponent responds…'; title='Follow the line';}
  else if(state.status==='puzzle-complete'){label=state.daily.slots[state.currentDailySlot].status==='revealed'?'Solution shown':'Puzzle solved'; title=state.currentDailySlot===2?'Daily boss complete':'Nice move';}
  else if(state.status==='revealing'){label='Showing solution…'; title='Solution';}
  else if(state.status==='daily-complete'){label='3 of 3 complete'; title='Today’s challenge complete';}
  else{label='Your turn'; title='Find the best move';}
  document.getElementById('statusLabel').textContent=label;
  document.getElementById('puzzleTitle').textContent=title;
  const boardWrap=document.getElementById('boardWrap'); boardWrap.classList.toggle('complete-board',state.status==='daily-complete');
  const boardTip=document.getElementById('boardTip');
  if(boardTip){
    const hasMovedOnce=!!lsGet('tacdchess_board_tip_seen');
    const shouldShow=!hasMovedOnce && state.status==='player-turn' && !state.selectedSquare;
    boardTip.classList.toggle('show',shouldShow);
  }

  const banner=document.getElementById('banner'), actions=document.getElementById('bannerActions');
  if(state.status==='puzzle-complete'){
    const revealed=state.daily.slots[state.currentDailySlot].status==='revealed';
    banner.className='banner show good'; document.getElementById('bannerIcon').innerHTML=ICONS.check;
    document.getElementById('bannerTitle').textContent=revealed?'Solution shown':'Puzzle solved';
    document.getElementById('bannerSub').textContent=(revealed?'You kept your daily streak.':'Clean solve!')+' · '+(state.currentDailySlot+1)+' of 3';
    actions.innerHTML='<button class="btn btn-primary btn-sm" id="nextDailyBtn">'+(state.currentDailySlot===2?'Finish':'Next puzzle')+' '+ICONS.arrowRight+'</button>';
    document.getElementById('nextDailyBtn').addEventListener('click',function(){
      if(state.currentDailySlot===2){ finishDailyChallenge(); } else { goToNextDailyPuzzle(); }
    });
  }else if(state.status==='daily-complete'){
    banner.className='banner show good daily-finished'; document.getElementById('bannerIcon').innerHTML=ICONS.check;
    document.getElementById('bannerTitle').textContent='Today complete';
    const delta=state.ratingDeltaToday; const deltaText=delta>0?'Puzzle Rating +'+delta:(delta<0?'Puzzle Rating '+delta:'Puzzle Rating unchanged');
    document.getElementById('bannerSub').textContent='🔥 '+state.streak+' day streak';
    actions.innerHTML='<button class="btn btn-primary btn-sm" id="reviewBtn">Review today</button>';
    document.getElementById('reviewBtn').addEventListener('click',openReview);
    document.getElementById('dailyHintNote').textContent='';
  }else{
    banner.className='banner'; actions.innerHTML='';
  }
  const controls=document.getElementById('controlsRow');
  const hintAllowed=state.status==='player-turn' && !state.daily.complete;
  controls.hidden=false;
  if(state.status==='player-turn'){
    controls.className='controls-row';
    controls.innerHTML='<button class="btn btn-ghost" id="hintBtn">'+ICONS.bulb+' Hint</button><button class="btn btn-reveal" id="revealBtn">'+ICONS.eye+' Reveal</button>';
    if(hintAllowed) document.getElementById('hintBtn').addEventListener('click',useHint);
    document.getElementById('revealBtn').addEventListener('click',revealSolution);
  }else if(state.status==='puzzle-complete'){
    // The banner already contains the single Next puzzle action.
    // Hide Hint/Reveal until that action loads the next puzzle.
    controls.className='controls-row';
    controls.innerHTML='';
    controls.hidden=true;
  }else if(state.status==='daily-complete'){
    controls.className='controls-row single'; controls.innerHTML='<button class="btn btn-primary" id="reviewBottom">Review today’s puzzles</button>';
    document.getElementById('reviewBottom').addEventListener('click',openReview);
  }else{
    controls.className='controls-row single'; controls.innerHTML='<button class="btn btn-ghost" disabled>Opponent is thinking…</button>';
  }
  const note=document.getElementById('dailyHintNote');
  if(state.status==='player-turn') note.textContent=state.hintUsed?'Hint used · you can still solve normally.':'';
  else if(state.status==='daily-complete') note.textContent='Next challenge in '+untilLocalMidnight()+' · local time';
  else note.textContent='';
  renderBoard();
}

/* ---- onboarding ---- */
function showOnboarding(){
  return new Promise(function(resolve){
    const overlay=document.getElementById('onboardOverlay'), input=document.getElementById('onboardRatingInput'), presets=document.getElementById('onboardPresets');
    overlay.style.display='flex'; ensureUserId();
    presets.querySelectorAll('.preset-btn').forEach(function(btn){btn.addEventListener('click',function(){input.value=btn.dataset.v;presets.querySelectorAll('.preset-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');});});
    input.addEventListener('input',function(){presets.querySelectorAll('.preset-btn').forEach(function(b){b.classList.toggle('active',b.dataset.v===input.value);});});
    document.getElementById('onboardStartBtn').addEventListener('click',function(){
      let v=parseInt(input.value,10); if(!Number.isFinite(v)) v=1200; state.playerRating=clamp(v,DAILY_MIN_RATING,DAILY_MAX_RATING); overlay.style.display='none'; resolve();
    });
  });
}

function checkDayChange(){
  const today=localDateKey();
  if(!state.daily || state.daily.date!==today){
    ensureDailyChallenge(true);
    state.status='player-turn';
    loadDailyPuzzleSlot(0);
    renderAll();
  }else if(state.daily.complete){
    // keep completed challenge locked until the local day changes
    state.status='daily-complete';
    state.currentDailySlot=2; state.currentPuzzleIndex=state.daily.puzzleIds[2];
    if(!state.chess) loadPuzzleByIndex(state.currentPuzzleIndex,false,0); else renderAll();
  }
}

/* ---- init ---- */
async function init(){
  ensureUserId(); buildSkeleton();
  const onboarded=await loadProgress();
  if(!onboarded){ await showOnboarding(); ensureDailyChallenge(true); }
  else { if(!state.daily || state.daily.date!==localDateKey()) ensureDailyChallenge(true); }
  if(state.daily.complete){ state.currentDailySlot=2; loadPuzzleByIndex(state.daily.puzzleIds[2],false,0); state.status='daily-complete'; renderAll(); }
  else {
    let slot=state.daily.currentSlot||0;
    for(let i=0;i<3;i++){ if(state.daily.slots[i].status==='pending'){slot=i;break;} }
    loadDailyPuzzleSlot(slot);
  }
  document.getElementById('soundBtn').innerHTML=state.soundOn?ICONS.soundOn:ICONS.soundOff;
  document.getElementById('soundBtn').classList.toggle('active',state.soundOn);
  saveProgress();
  setInterval(checkDayChange,30000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden) checkDayChange();});
  window.addEventListener('focus',checkDayChange);
}
init();
